<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Regency Court</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="card-header">
        <div class="icon-row">
          <!-- Envelope -->
          <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm0 2v.2l9 5.4 9-5.4V7H3zm0 3.3V18h18v-7.7l-8.4 5.1a1.5 1.5 0 0 1-1.6 0L3 10.3z"/>
            </svg>
          </div>
          <!-- Phone -->
          <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.1 3.1 9.7 2a1 1 0 0 1 1.3.6l1.3 3.8a1 1 0 0 1-.3 1.1l-1.8 1.7a11.5 11.5 0 0 0 4.9 4.9l1.7-1.8a1 1 0 0 1 1.1-.3l3.8 1.3a1 1 0 0 1 .6 1.3l-1.1 2.6A1.5 1.5 0 0 1 20 19c-8.3 0-15-6.7-15-15 0-.6.3-1.1.8-1.4z"/>
            </svg>
          </div>
          <!-- Chat bubble -->
          <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-5.6L9 21.5A1 1 0 0 1 7.4 20l1-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
            </svg>
          </div>
        </div>
        <h1>Regency Court</h1>
      </header>

      <section class="language-section">
        <label for="languageSelect" id="languageLabel">🌐 Select language</label>
        <select id="languageSelect"></select>
      </section>

      <section class="actions">
        <button id="viewRulesBtn" class="primary-btn">
          📜 <span class="btn-text">View site rules</span>
        </button>
        <a id="reportIssueBtn" class="secondary-btn" href="#">
          ✉️ <span class="btn-text">Report an issue to the Block Management Company</span>
        </a>
      </section>

      <section id="rulesPanel" class="rules-panel" hidden>
        <h2 id="rulesTitle">Regency Court Site Rules</h2>
        <div id="rulesContent"></div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
